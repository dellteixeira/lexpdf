name: Refresh integration lock

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.head_ref == 'integration/audit-hardening-3-9'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Refresh pubspec.lock
        working-directory: apps/lexpdf_app
        run: flutter pub get
      - name: Commit refreshed lock
        run: |
          if git diff --quiet -- apps/lexpdf_app/pubspec.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/lexpdf_app/pubspec.lock
          git commit -m 'chore: refresh Flutter dependency lock'
          git push origin HEAD:${{ github.head_ref }}
