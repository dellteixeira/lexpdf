name: Apply Android link fix

on:
  push:
    branches:
      - fix/android-robust-internal-links

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-robust-internal-links
          fetch-depth: 0
      - name: Patch Android PDF navigation
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = """  bool get _windows => defaultTargetPlatform == TargetPlatform.windows;\n\n  bool get _windows10Tiles => isWindows10ManualTileRenderingEnabled();\n"""
          new = """  bool get _windows => defaultTargetPlatform == TargetPlatform.windows;\n\n  bool get _android => defaultTargetPlatform == TargetPlatform.android;\n\n  bool get _windows10Tiles => isWindows10ManualTileRenderingEnabled();\n"""
          if old not in text:
              raise SystemExit('android getter anchor not found')
          text = text.replace(old, new, 1)

          old = "loadPageDimensionsOnDemand: !_windows,"
          new = """// Android internal PDF destinations are resolved against the full\n                            // page layout. For very large indexed PDFs, lazy dimensions can\n                            // make a destination matrix point at a stale/partial layout.\n                            loadPageDimensionsOnDemand: !_windows && !_android,"""
          if old not in text:
              raise SystemExit('dimension loading anchor not found')
          text = text.replace(old, new, 1)

          old = """                              final dest = link.dest;\n                              if (dest != null) {\n                                unawaited(_controller.goToDest(dest));\n                              }\n"""
          new = """                              final dest = link.dest;\n                              if (dest != null) {\n                                unawaited(_goToInternalPdfDestination(dest));\n                              }\n"""
          if old not in text:
              raise SystemExit('link handler anchor not found')
          text = text.replace(old, new, 1)

          anchor = """  Widget _buildCommandBar(String path) {\n"""
          helper = """  Future<void> _goToInternalPdfDestination(PdfDest dest) async {\n    final document = _document;\n    final targetPage = dest.pageNumber;\n    if (document == null ||\n        targetPage < 1 ||\n        targetPage > document.pages.length ||\n        !_controller.isReady) {\n      return;\n    }\n\n    if (!_android) {\n      await _controller.goToDest(dest);\n      return;\n    }\n\n    // Android robust-link path: first establish the correct physical page on\n    // the fully measured layout. Only then apply the PDF destination matrix.\n    // This avoids a stale /Fit or /XYZ transform on large documents whose page\n    // dimensions were previously loaded on demand.\n    await _controller.goToPage(\n      pageNumber: targetPage,\n      anchor: PdfPageAnchor.top,\n      duration: Duration.zero,\n    );\n\n    // Give the viewer one frame to publish the new layout/viewport before\n    // resolving the exact destination. This retains intra-page links while\n    // making page-only index links deterministic.\n    await Future<void>.delayed(const Duration(milliseconds: 32));\n    if (!mounted || !_controller.isReady) return;\n\n    final moved = await _controller.goToDest(dest, duration: Duration.zero);\n    if (!moved) {\n      await _controller.goToPage(\n        pageNumber: targetPage,\n        anchor: PdfPageAnchor.top,\n        duration: Duration.zero,\n      );\n      return;\n    }\n\n    // A second-frame guard handles pdfrx/Android cases where a destination\n    // transform is accepted but resolves against the wrong page. Never apply\n    // numeric +1/-1 offsets: PdfDest.pageNumber is already the physical page.\n    await Future<void>.delayed(const Duration(milliseconds: 32));\n    if (!mounted || !_controller.isReady) return;\n    final currentPage = _controller.pageNumber;\n    if (currentPage != null && currentPage != targetPage) {\n      await _controller.goToPage(\n        pageNumber: targetPage,\n        anchor: PdfPageAnchor.top,\n        duration: Duration.zero,\n      );\n    }\n  }\n\n"""
          if anchor not in text:
              raise SystemExit('command bar anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('apps/lexpdf_app/test/android_internal_link_navigation_contract_test.dart')
          test.write_text("""import 'dart:io';\n\nimport 'package:flutter_test/flutter_test.dart';\n\nvoid main() {\n  test('Android internal PDF links use fully measured deterministic navigation', () {\n    final source = File('lib/src/screens/pdf_workspace_stylus_screen.dart')\n        .readAsStringSync();\n\n    expect(source, contains('bool get _android =>'));\n    expect(\n      source,\n      contains('loadPageDimensionsOnDemand: !_windows && !_android'),\n    );\n    expect(source, contains('_goToInternalPdfDestination(dest)'));\n    expect(source, contains('final targetPage = dest.pageNumber;'));\n    expect(source, contains('pageNumber: targetPage'));\n    expect(source, contains('anchor: PdfPageAnchor.top'));\n    expect(source, contains('await _controller.goToDest(dest, duration: Duration.zero)'));\n    expect(source, contains('currentPage != targetPage'));\n    expect(source, isNot(contains('targetPage + 1')));\n    expect(source, isNot(contains('targetPage - 1')));\n  });\n}\n""", encoding='utf-8')

          workflow = Path('.github/workflows/_tmp_apply_android_link_fix.yml')
          workflow.unlink()
      - name: Commit patched implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make Android PDF index navigation deterministic"
          git push origin HEAD:fix/android-robust-internal-links
