name: Apply default hand tool

on:
  push:
    branches:
      - fix/default-hand-tool-on-open

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-hand-tool-on-open
          fetch-depth: 0
      - name: Set hand as default PDF tool
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart')
          text = path.read_text(encoding='utf-8')
          old = """    _stylusMode = defaultTargetPlatform == TargetPlatform.android\n        ? _StylusMode.pen\n        : _StylusMode.hand;\n"""
          new = """    // Open every PDF in navigation mode. Drawing tools are opt-in so\n    // touch/drag gestures immediately move through pages on mobile and desktop.\n    _stylusMode = _StylusMode.hand;\n"""
          if old not in text:
              raise SystemExit('Expected Android pen default was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/_tmp_set_default_hand.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart
          git commit -m "fix: open PDFs with hand tool by default"
          git push origin HEAD:fix/default-hand-tool-on-open
