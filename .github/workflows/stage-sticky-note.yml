name: Stage sticky note annotation implementation

on:
  push:
    branches:
      - feat/sticky-note-annotations

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sticky-note-annotations
      - name: Apply workspace patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, found {count}: {old[:70]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "import '../widgets/pdf_selection_action_menu.dart';\nimport '../widgets/pdf_stylus_page_overlay.dart';\nimport 'pdf_advanced_annotation_screen.dart';",
              "import '../widgets/pdf_selection_action_menu.dart';\nimport '../widgets/pdf_sticky_note_overlay.dart';\nimport '../widgets/pdf_stylus_page_overlay.dart';",
          )
          replace_once(
              'enum _StylusMode { hand, selectText, pen, pencil, highlighter, eraser }',
              'enum _StylusMode { hand, selectText, note, pen, highlighter, eraser }',
          )
          replace_once(
              "        _StylusMode.pen ||\n        _StylusMode.pencil ||\n        _StylusMode.highlighter ||",
              "        _StylusMode.pen ||\n        _StylusMode.highlighter ||",
          )
          replace_once(
              "  InkTool get _inkTool => switch (_stylusMode) {\n        _StylusMode.pencil => InkTool.pencil,\n        _StylusMode.highlighter => InkTool.highlighter,",
              "  InkTool get _inkTool => switch (_stylusMode) {\n        _StylusMode.highlighter => InkTool.highlighter,",
          )
          replace_once(
              '                          panEnabled: !_inkMode || _mobile,\n                          scaleEnabled: !_inkMode || _mobile,',
              "                          panEnabled: _stylusMode == _StylusMode.note\n                              ? false\n                              : (!_inkMode || _mobile),\n                          scaleEnabled: _stylusMode == _StylusMode.note\n                              ? false\n                              : (!_inkMode || _mobile),",
          )
          replace_once(
              "                                onEraseApplied: _onEraseApplied,\n                              ),\n                            ),\n                          ],",
              "                                onEraseApplied: _onEraseApplied,\n                              ),\n                            ),\n                            Positioned.fill(\n                              child: PdfStickyNoteOverlay(\n                                key: ValueKey(\n                                  'sticky-${page.pageNumber}-${_stylusMode.name}',\n                                ),\n                                documentId: widget.document.id,\n                                pageNumber: page.pageNumber,\n                                store: widget.annotations.objectStore,\n                                createEnabled: _stylusMode == _StylusMode.note,\n                                onNoteSaved: () {\n                                  if (!mounted) return;\n                                  setState(() => _stylusMode = _StylusMode.hand);\n                                  _controller.invalidate();\n                                },\n                              ),\n                            ),\n                          ],",
          )
          replace_once(
              "              _stylusButton(_StylusMode.pen, Icons.edit, 'Caneta'),\n              _stylusButton(_StylusMode.pencil, Icons.draw_outlined, 'Lápis'),",
              "              _stylusButton(\n                _StylusMode.note,\n                Icons.sticky_note_2_outlined,\n                'Anotar',\n              ),\n              _stylusButton(_StylusMode.pen, Icons.edit, 'Caneta'),",
          )
          replace_once(
              "              _CommandButton(\n                icon: Icons.draw_outlined,\n                label: 'Anotar',\n                onPressed: _openAnnotations,\n              ),\n",
              '',
          )
          start = text.find('  Future<void> _openAnnotations() async {')
          end = text.find('  Future<void> _openPageTools()', start)
          if start < 0 or end < 0:
              raise SystemExit('could not locate _openAnnotations block')
          text = text[:start] + text[end:]
          path.write_text(text)
          PY
          rm .github/workflows/stage-sticky-note.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add sticky note annotations and simplify ink toolbar'
          git push origin HEAD:feat/sticky-note-annotations
