name: Apply Windows PDF quality preview fix

on:
  push:
    branches:
      - fix/windows-pdf-quality-preview
    paths:
      - .github/workflows/apply-windows-pdf-quality-preview.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-pdf-quality-preview
          fetch-depth: 0

      - name: Disable low-resolution PDF preview on Windows
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart')
          source = path.read_text(encoding='utf-8')
          old = 'enableLowResolutionPagePreview: true,'
          new = 'enableLowResolutionPagePreview: !_windows,'
          if source.count(old) != 1:
              raise SystemExit(f'Expected exactly one {old!r}, found {source.count(old)}')
          path.write_text(source.replace(old, new), encoding='utf-8')

          test = Path('apps/lexpdf_app/test/windows_pdf_vector_quality_contract_test.dart')
          test.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('Windows disables low-resolution PDF page preview', () {
    final source = File(
      'lib/src/screens/pdf_workspace_stylus_screen.dart',
    ).readAsStringSync();

    expect(source, contains('enableLowResolutionPagePreview: !_windows'));
    expect(source, isNot(contains('enableLowResolutionPagePreview: true')));
  });
}
""", encoding='utf-8')

      - name: Commit quality fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart \
                  apps/lexpdf_app/test/windows_pdf_vector_quality_contract_test.dart
          git diff --cached --check
          git commit -m "fix: preserve PDF vector quality on Windows"
          git push origin HEAD:fix/windows-pdf-quality-preview
