name: Release Candidate Distribution

on:
  workflow_dispatch:

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          raw=$(grep '^version:' apps/lexpdf_app/pubspec.yaml | awk '{print $2}')
          version=${raw%%+*}
          test -n "$version"
          printf '%s\n' "$raw" | grep -Eq '^1\.0\.0-rc\.[1-9][0-9]*\+[1-9][0-9]*$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          grep -q "flutter-version: '3.47.2'" .github/workflows/beta-distribution.yml

  android-signed:
    needs: preflight
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/lexpdf_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Require Android signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LEXPDF_ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.LEXPDF_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.LEXPDF_ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.LEXPDF_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          python3 - <<'PY'
          import base64, binascii, os, pathlib, re, sys
          raw = os.environ['KEYSTORE_B64'].lstrip('\ufeff').strip()
          if len(raw) >= 2 and raw[0] == raw[-1] and raw[0] in "'\"":
              raw = raw[1:-1]
          normalized = re.sub(r'\s+', '', raw)
          try:
              data = base64.b64decode(normalized, validate=True)
          except (binascii.Error, ValueError) as exc:
              print(f'Invalid LEXPDF_ANDROID_KEYSTORE_BASE64: {exc}', file=sys.stderr)
              sys.exit(1)
          if len(data) < 32:
              print('Decoded keystore is unexpectedly small.', file=sys.stderr)
              sys.exit(1)
          pathlib.Path('android/app/lexpdf-release.jks').write_bytes(data)
          PY
          keytool -list -keystore android/app/lexpdf-release.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=lexpdf-release.jks
          EOF
      - run: flutter pub get
      - run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze
      - run: flutter test
      - name: Build signed Android APK
        run: >-
          flutter build apk --release
          --dart-define=LEXPDF_ENVIRONMENT=production
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - name: Build signed Android App Bundle
        run: >-
          flutter build appbundle --release
          --dart-define=LEXPDF_ENVIRONMENT=production
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - name: Verify Android signature and checksums
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          aab='build/app/outputs/bundle/release/app-release.aab'
          test -s "$apk"
          test -s "$aab"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
            echo 'Android SDK build-tools directory was not found.' >&2
            exit 1
          fi
          apksigner_path=$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)
          if [ -z "$apksigner_path" ] || [ ! -x "$apksigner_path" ]; then
            echo 'apksigner was not found in Android SDK build-tools.' >&2
            exit 1
          fi
          "$apksigner_path" verify --verbose --print-certs "$apk"
          sha256sum "$apk" "$aab" > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LexPDF-${{ needs.preflight.outputs.version }}-Android
          path: |
            apps/lexpdf_app/build/app/outputs/flutter-apk/app-release.apk
            apps/lexpdf_app/build/app/outputs/bundle/release/app-release.aab
            apps/lexpdf_app/SHA256SUMS-Android.txt
          if-no-files-found: error

  windows-installer:
    needs: preflight
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/lexpdf_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Configure optional Windows signing
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.LEXPDF_WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.LEXPDF_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCert = -not [string]::IsNullOrWhiteSpace($env:CERT_B64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CERT_PASSWORD)
          if ($hasCert -xor $hasPassword) {
            throw 'Windows signing is optional, but LEXPDF_WINDOWS_CERTIFICATE_BASE64 and LEXPDF_WINDOWS_CERTIFICATE_PASSWORD must be supplied together.'
          }
          if (-not $hasCert) {
            'WINDOWS_SIGNING_ENABLED=false' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host 'Windows code signing is disabled for this RC; unsigned installer generation is allowed.'
            exit 0
          }
          $bytes = [Convert]::FromBase64String(($env:CERT_B64 -replace '\s',''))
          $path = Join-Path $env:RUNNER_TEMP 'lexpdf-code-signing.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          $secure = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Get-PfxCertificate -FilePath $path -Password $secure
          if ($null -eq $cert -or -not $cert.HasPrivateKey) { throw 'Windows signing certificate is invalid or has no private key.' }

          # Avoid Import-Certificate for trust bootstrap because importing a self-signed
          # certificate into Root can block on an interactive confirmation dialog in a
          # headless GitHub-hosted runner. Use X509Store directly instead.
          foreach ($storeName in @('Root', 'TrustedPublisher')) {
            $store = [System.Security.Cryptography.X509Certificates.X509Store]::new(
              $storeName,
              [System.Security.Cryptography.X509Certificates.StoreLocation]::CurrentUser
            )
            try {
              $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
              $store.Add($cert)
            } finally {
              $store.Close()
            }
          }
          'WINDOWS_SIGNING_ENABLED=true' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: git diff --exit-code -- pubspec.lock
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=LEXPDF_ENVIRONMENT=production
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - name: Sign and verify LexPDF executable
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.LEXPDF_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'lexpdf-code-signing.pfx'
          $exe = 'build\windows\x64\runner\Release\lexpdf_app.exe'
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CERT_PASSWORD $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signature = Get-AuthenticodeSignature $exe
          if ($signature.Status -ne 'Valid') { throw "Invalid executable signature: $($signature.Status)" }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = '${{ needs.preflight.outputs.version }}'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DMyAppVersion=$version" 'windows\installer\LexPDF.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign and verify Windows installer
        if: env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.LEXPDF_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signtool) { throw 'signtool.exe was not found.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'lexpdf-code-signing.pfx'
          $installer = Get-ChildItem 'windows\installer\output\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced.' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:CERT_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Invalid installer signature: $($signature.Status)" }
      - name: Record Windows checksum and signing mode
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'windows\installer\output\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced.' }
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($installer.Name)" | Set-Content -Encoding ascii 'SHA256SUMS-Windows.txt'
          $exe = 'build\windows\x64\runner\Release\lexpdf_app.exe'
          $exeStatus = (Get-AuthenticodeSignature $exe).Status
          $installerStatus = (Get-AuthenticodeSignature $installer.FullName).Status
          if ($env:WINDOWS_SIGNING_ENABLED -eq 'true') {
            if ($exeStatus -ne 'Valid' -or $installerStatus -ne 'Valid') { throw 'Expected valid Authenticode signatures.' }
            @(
              'mode=signed',
              "executable_authenticode=$exeStatus",
              "installer_authenticode=$installerStatus"
            ) | Set-Content -Encoding ascii 'WINDOWS_SIGNING_STATUS.txt'
          } else {
            if ($exeStatus -eq 'Valid' -or $installerStatus -eq 'Valid') { throw 'Unsigned RC unexpectedly reports a valid Authenticode signature.' }
            @(
              'mode=unsigned',
              "executable_authenticode=$exeStatus",
              "installer_authenticode=$installerStatus"
            ) | Set-Content -Encoding ascii 'WINDOWS_SIGNING_STATUS.txt'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LexPDF-${{ needs.preflight.outputs.version }}-Windows-Installer
          path: |
            apps/lexpdf_app/windows/installer/output/*.exe
            apps/lexpdf_app/SHA256SUMS-Windows.txt
            apps/lexpdf_app/WINDOWS_SIGNING_STATUS.txt
          if-no-files-found: error
