name: Normalize Package Imports

on:
  push:
    branches:
      - feature/pre-release-remediation
    paths:
      - 'apps/lexpdf_app/pubspec.yaml'
      - '.github/workflows/normalize-package-imports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Replace legacy package URI
        shell: bash
        run: |
          set -euo pipefail
          grep -RIl --exclude-dir=.dart_tool 'package:lexxpdf_app/' apps/lexpdf_app \
            | xargs -r sed -i 's#package:lexxpdf_app/#package:lexpdf_app/#g'
      - name: Commit normalized imports
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/lexpdf_app
          if git diff --cached --quiet; then
            echo 'No legacy package imports remain.'
            exit 0
          fi
          git commit -m 'refactor: normalize LexPDF package imports'
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
