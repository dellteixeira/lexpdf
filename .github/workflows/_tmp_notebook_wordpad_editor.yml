name: Apply notebook WordPad editor
on:
  push:
    branches:
      - feat/notebook-wordpad-editor
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notebook-wordpad-editor
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Apply patch
        run: python .github/scripts/apply_notebook_wordpad_editor.py
      - name: Format Dart
        run: |
          cd apps/lexpdf_app
          dart format lib/src/screens/layered_notebook_screen.dart lib/src/widgets/notebook_object_layer.dart test/notebook_wordpad_editor_contract_test.dart
      - name: Run focused tests
        run: |
          cd apps/lexpdf_app
          flutter pub get
          flutter test test/notebook_wordpad_editor_contract_test.dart test/notebook_rich_text_contract_test.dart test/notebook_text_input_contract_test.dart test/notebook_editor_ux_contract_test.dart
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lexpdf_app
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: redesign notebook as WordPad-style page editor"
          git push origin HEAD:feat/notebook-wordpad-editor
