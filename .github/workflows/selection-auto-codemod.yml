name: Apply automatic selection menu codemod

on:
  push:
    branches:
      - fix/automatic-selection-actions

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/automatic-selection-actions
          fetch-depth: 0
      - name: Apply selection menu behavior across all PDF viewers
        shell: python
        run: |
          from pathlib import Path

          root = Path('apps/lexpdf_app')

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source fragment not found in {path}: {old!r}')
              text = text.replace(old, new, 1)
              path.write_text(text)

          # Unified stylus workspace: already opted into automatic menus; add an
          # explicit selection-change invalidation so the toolbar is rebuilt as
          # soon as the drag/handles settle, without requiring a second tap.
          p = root / 'lib/src/screens/pdf_workspace_stylus_screen.dart'
          replace_once(
              p,
              '''textSelectionParams: PdfTextSelectionParams(\n                              enabled: _stylusMode == _StylusMode.selectText,\n                              showContextMenuAutomatically: true,\n                            ),''',
              '''textSelectionParams: PdfTextSelectionParams(\n                              enabled: _stylusMode == _StylusMode.selectText,\n                              showContextMenuAutomatically: true,\n                              onTextSelectionChange: (_) {\n                                if (_controller.isReady) {\n                                  _controller.invalidate();\n                                }\n                              },\n                            ),''',
          )

          # General reader.
          p = root / 'lib/src/screens/pdf_reader_screen.dart'
          replace_once(
              p,
              'textSelectionParams: PdfTextSelectionParams(enabled: !_inkMode),',
              '''textSelectionParams: PdfTextSelectionParams(\n                  enabled: !_inkMode,\n                  showContextMenuAutomatically: true,\n                  onTextSelectionChange: (_) {\n                    if (_viewerController.isReady) {\n                      _viewerController.invalidate();\n                    }\n                  },\n                ),''',
          )

          # Advanced annotation viewer.
          p = root / 'lib/src/screens/pdf_advanced_annotation_screen.dart'
          replace_once(
              p,
              '''textSelectionParams:\n                  PdfTextSelectionParams(enabled: !_editMode),''',
              '''textSelectionParams: PdfTextSelectionParams(\n                enabled: !_editMode,\n                showContextMenuAutomatically: true,\n                onTextSelectionChange: (_) {\n                  if (_controller.isReady) {\n                    _controller.invalidate();\n                  }\n                },\n              ),''',
          )

          # Navigation-only viewer still has text selection enabled by pdfrx by
          # default. Make automatic actions explicit here as well.
          p = root / 'lib/src/screens/pdf_navigation_screen.dart'
          replace_once(
              p,
              '''params: PdfViewerParams(\n          layoutPages:''',
              '''params: PdfViewerParams(\n          textSelectionParams: PdfTextSelectionParams(\n            showContextMenuAutomatically: true,\n            onTextSelectionChange: (_) {\n              if (_controller.isReady) {\n                _controller.invalidate();\n              }\n            },\n          ),\n          layoutPages:''',
          )

          # Strengthen the existing source contract so every selectable PDF
          # surface must retain automatic post-selection actions.
          p = root / 'test/pdf_selection_spen_eraser_contract_test.dart'
          text = p.read_text()
          marker = "  test('eraser has adjustable width and side-button shortcut', () {"
          if marker not in text:
              raise SystemExit('Selection contract insertion point not found')
          test = r'''  test('all PDF text-selection surfaces open actions automatically', () {
    const paths = <String>[
      'lib/src/screens/pdf_workspace_stylus_screen.dart',
      'lib/src/screens/pdf_reader_screen.dart',
      'lib/src/screens/pdf_advanced_annotation_screen.dart',
      'lib/src/screens/pdf_navigation_screen.dart',
    ];

    for (final path in paths) {
      final source = File(path).readAsStringSync();
      expect(
        source,
        contains('showContextMenuAutomatically: true'),
        reason: '$path must show actions immediately when selection ends',
      );
      expect(
        source,
        contains('onTextSelectionChange:'),
        reason: '$path must refresh the selection overlay without another tap',
      );
    }
  });

'''
          p.write_text(text.replace(marker, test + marker, 1))

          # This helper workflow is only a transport for the atomic codemod and
          # must not remain in the product repository.
          Path('.github/workflows/selection-auto-codemod.yml').unlink()
      - name: Commit codemod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: show PDF selection actions automatically"
          git push origin HEAD:fix/automatic-selection-actions
