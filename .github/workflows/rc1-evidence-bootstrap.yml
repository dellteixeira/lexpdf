name: RC1 Automated Evidence Bootstrap

on:
  workflow_dispatch:
    inputs:
      distribution_run_id:
        description: Successful Release Candidate Distribution run ID
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character RC source commit SHA
        required: true
        type: string
  workflow_run:
    workflows:
      - Release Candidate Distribution
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  collect-evidence:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    env:
      RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.distribution_run_id }}
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.candidate_sha }}
    steps:
      - name: Validate resolved run identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Verify distribution run identity
        id: run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > "$RUNNER_TEMP/run.json"
          actual_sha=$(jq -r '.head_sha' "$RUNNER_TEMP/run.json")
          conclusion=$(jq -r '.conclusion' "$RUNNER_TEMP/run.json")
          workflow_name=$(jq -r '.name' "$RUNNER_TEMP/run.json")
          run_url=$(jq -r '.html_url' "$RUNNER_TEMP/run.json")
          run_attempt=$(jq -r '.run_attempt' "$RUNNER_TEMP/run.json")
          test "$actual_sha" = "$CANDIDATE_SHA"
          test "$conclusion" = 'success'
          test "$workflow_name" = 'Release Candidate Distribution'
          echo "run_url=$run_url" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Resolve candidate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          raw=$(grep '^version:' apps/lexpdf_app/pubspec.yaml | awk '{print $2}')
          printf '%s\n' "$raw" | grep -Eq '^1\.0\.0-rc\.[1-9][0-9]*\+[1-9][0-9]*$'
          version=${raw%%+*}
          echo "raw=$raw" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download RC distribution artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.RUN_ID }}
          pattern: LexPDF-${{ steps.version.outputs.version }}-*
          path: rc-artifacts
          merge-multiple: true

      - name: Verify artifact checksums and Windows signing mode
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -s rc-artifacts/SHA256SUMS-Android.txt
          test -s rc-artifacts/SHA256SUMS-Windows.txt
          test -s rc-artifacts/WINDOWS_SIGNING_STATUS.txt

          verify_named_hash() {
            local sums_file="$1"
            local filename="$2"
            local artifact
            artifact=$(find rc-artifacts -type f -name "$filename" -print -quit)
            test -n "$artifact"
            local expected
            expected=$(awk -v n="$filename" '$2 ~ n"$" {print $1; exit}' "$sums_file")
            test -n "$expected"
            local actual
            actual=$(sha256sum "$artifact" | awk '{print $1}')
            test "$actual" = "$expected"
            printf '%s' "$actual"
          }

          normalize_value() {
            printf '%s' "$1" | tr -d '\r'
          }

          apk_sha=$(verify_named_hash rc-artifacts/SHA256SUMS-Android.txt app-release.apk)
          aab_sha=$(verify_named_hash rc-artifacts/SHA256SUMS-Android.txt app-release.aab)
          installer=$(find rc-artifacts -type f -iname '*.exe' -print -quit)
          test -n "$installer"
          installer_name=$(basename "$installer")
          windows_sha=$(verify_named_hash rc-artifacts/SHA256SUMS-Windows.txt "$installer_name")
          signing_mode=$(normalize_value "$(awk -F= '$1 == \"mode\" {print $2; exit}' rc-artifacts/WINDOWS_SIGNING_STATUS.txt)")
          case "$signing_mode" in
            signed|unsigned) ;;
            *) echo "Invalid Windows signing mode: $signing_mode" >&2; exit 1 ;;
          esac
          exe_auth=$(normalize_value "$(awk -F= '$1 == \"executable_authenticode\" {print $2; exit}' rc-artifacts/WINDOWS_SIGNING_STATUS.txt)")
          installer_auth=$(normalize_value "$(awk -F= '$1 == \"installer_authenticode\" {print $2; exit}' rc-artifacts/WINDOWS_SIGNING_STATUS.txt)")
          test -n "$exe_auth"
          test -n "$installer_auth"
          if [ "$signing_mode" = signed ]; then
            test "$exe_auth" = Valid
            test "$installer_auth" = Valid
          fi

          echo "apk_sha=$apk_sha" >> "$GITHUB_OUTPUT"
          echo "aab_sha=$aab_sha" >> "$GITHUB_OUTPUT"
          echo "installer_name=$installer_name" >> "$GITHUB_OUTPUT"
          echo "windows_sha=$windows_sha" >> "$GITHUB_OUTPUT"
          echo "windows_signing_mode=$signing_mode" >> "$GITHUB_OUTPUT"
          echo "windows_exe_auth=$exe_auth" >> "$GITHUB_OUTPUT"
          echo "windows_installer_auth=$installer_auth" >> "$GITHUB_OUTPUT"

      - name: Generate automated evidence record
        shell: bash
        env:
          RUN_URL: ${{ steps.run.outputs.run_url }}
          RUN_ATTEMPT: ${{ steps.run.outputs.run_attempt }}
          RAW_VERSION: ${{ steps.version.outputs.raw }}
          APK_SHA: ${{ steps.verify.outputs.apk_sha }}
          AAB_SHA: ${{ steps.verify.outputs.aab_sha }}
          WINDOWS_NAME: ${{ steps.verify.outputs.installer_name }}
          WINDOWS_SHA: ${{ steps.verify.outputs.windows_sha }}
          WINDOWS_SIGNING_MODE: ${{ steps.verify.outputs.windows_signing_mode }}
          WINDOWS_EXE_AUTH: ${{ steps.verify.outputs.windows_exe_auth }}
          WINDOWS_INSTALLER_AUTH: ${{ steps.verify.outputs.windows_installer_auth }}
        run: |
          set -euo pipefail
          mkdir -p rc-evidence
          cat > rc-evidence/RC1_AUTOMATED_EVIDENCE.md <<EOF
          # LexPDF RC1 — Automated Evidence

          Generated from a successful `Release Candidate Distribution` run.

          - Candidate version: `$RAW_VERSION`
          - Candidate source SHA: `$CANDIDATE_SHA`
          - Distribution run ID: `$RUN_ID`
          - Distribution run attempt: `$RUN_ATTEMPT`
          - Distribution run URL: $RUN_URL
          - Distribution conclusion: `success`
          - Release distribution scope: `Android + Windows`

          ## Artifact SHA-256 verification

          - Android APK `app-release.apk`: `$APK_SHA`
          - Android AAB `app-release.aab`: `$AAB_SHA`
          - Windows installer `$WINDOWS_NAME`: `$WINDOWS_SHA`
          - Recomputed hashes match the checksum files shipped by the distribution workflow: `PASS`

          ## Windows signing mode

          - Mode: `$WINDOWS_SIGNING_MODE`
          - Executable Authenticode status: `$WINDOWS_EXE_AUTH`
          - Installer Authenticode status: `$WINDOWS_INSTALLER_AUTH`

          Windows Authenticode is optional for this release scope. When signing credentials are absent,
          the distribution workflow is allowed to publish an explicitly recorded unsigned installer.

          ## Scope

          This automated record proves distribution-run identity, artifact checksum integrity, and the
          recorded Windows signing mode only. It does **not** replace Android certificate identity capture,
          installation tests, real-device/runtime validation, large-PDF rendering observations,
          first usable rendered-page timing, or memory measurements. Those remain manual evidence
          in `docs/RC1_EVIDENCE.md` until actually executed.
          EOF

          cp rc-artifacts/SHA256SUMS-Android.txt rc-evidence/
          cp rc-artifacts/SHA256SUMS-Windows.txt rc-evidence/
          cp rc-artifacts/WINDOWS_SIGNING_STATUS.txt rc-evidence/

      - uses: actions/upload-artifact@v4
        with:
          name: LexPDF-${{ steps.version.outputs.version }}-Automated-Evidence
          path: rc-evidence
          if-no-files-found: error
