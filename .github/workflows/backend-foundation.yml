name: Backend Foundation

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'apps/lexpdf_app/lib/src/core/backend/**'
      - 'apps/lexpdf_app/lib/src/core/cloud/cloud_gateway_document_provider.dart'
      - '.github/workflows/backend-foundation.yml'

jobs:
  cloudflare-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run check

  supabase-migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 12 migration safety invariants
        shell: bash
        run: |
          set -euo pipefail
          file='backend/supabase/migrations/20260907020000_complete_phase12_backend_security.sql'
          test -s "$file"
          grep -q 'enable row level security' "$file"
          grep -q 'revoke all on public.backend_events from anon, authenticated' "$file"
          grep -q 'to authenticated' "$file"
          grep -q 'as restrictive' "$file"
          grep -q 'security definer' "$file"
          grep -q 'revoke execute on function private.handle_new_user()' "$file"
          if grep -Eqi '(sb_secret_|postgres://)[[:space:]]*=' "$file"; then
            echo 'Potential credential material found in migration.' >&2
            exit 1
          fi

      - name: Verify sync parent ownership guards
        shell: bash
        run: |
          set -euo pipefail
          file='backend/supabase/migrations/20260907230000_harden_sync_parent_ownership.sql'
          test -s "$file"
          grep -q 'sync_queue_single_parent_check' "$file"
          grep -q 'sync_conflicts_single_parent_check' "$file"
          grep -q 'sync_queue_parent_owner_guard' "$file"
          grep -q 'sync_conflicts_parent_owner_guard' "$file"
          test "$(grep -c 'as restrictive' "$file")" -ge 2
          test "$(grep -c 'num_nonnulls(document_id, notebook_id) = 1' "$file")" -ge 2
          test "$(grep -c 'd.user_id = (select auth.uid())' "$file")" -ge 4
          test "$(grep -c 'n.user_id = (select auth.uid())' "$file")" -ge 4
          if grep -Eqi '(sb_secret_|postgres://)[[:space:]]*=' "$file"; then
            echo 'Potential credential material found in migration.' >&2
            exit 1
          fi
