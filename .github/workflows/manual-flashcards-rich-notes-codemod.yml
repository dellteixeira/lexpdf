name: Apply manual flashcards rich notes codemod

on:
  push:
    branches:
      - feature/manual-flashcards-rich-notes

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/manual-flashcards-rich-notes
          fetch-depth: 0
      - name: Apply codemod
        run: python3 tool/apply_manual_flashcards_rich_notes_v2.py
      - name: Normalize generated files
        run: python3 -c "from pathlib import Path; paths=[Path('apps/lexpdf_app/lib/src/widgets/pdf_selection_action_menu.dart'),Path('apps/lexpdf_app/lib/src/widgets/pdf_sticky_note_overlay.dart'),Path('apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart'),Path('apps/lexpdf_app/test/manual_flashcard_rich_note_contract_test.dart')]; [p.write_text(p.read_text().rstrip() + '\\n') for p in paths]"
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lexpdf_app/lib apps/lexpdf_app/test
          git diff --cached --check
          git commit -m "feat: manual flashcards and rich anchored PDF notes"
          git push origin HEAD:feature/manual-flashcards-rich-notes
