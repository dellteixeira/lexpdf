name: Temporary Apply Windows 10 Tile Patch

on:
  push:
    branches:
      - fix/windows10-manual-pdf-tiles

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows10-manual-pdf-tiles
          fetch-depth: 0
      - name: Apply deterministic workspace patch
        run: python tools/apply_windows10_tile_workspace_patch.py
      - name: Commit patch if needed
        shell: bash
        run: |
          if git diff --quiet -- apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart; then
            echo "Workspace already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/lexpdf_app/lib/src/screens/pdf_workspace_stylus_screen.dart
          git commit -m "fix: wire Windows 10 manual PDF tiles"
          git push origin HEAD:fix/windows10-manual-pdf-tiles
