name: LexPDF Office POC

on:
  push:
    branches:
      - poc/genoffice-docx
    paths:
      - 'experiments/lexpdf_office_poc/**'
      - '.github/workflows/office-poc.yml'
  pull_request:
    paths:
      - 'experiments/lexpdf_office_poc/**'
      - '.github/workflows/office-poc.yml'

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/lexpdf_office_poc

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install
      - run: npm test
      - run: npm run build
