name: Release Hardening

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  prerelease-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify reproducible release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/lexpdf_app/pubspec.lock
          test -d apps/lexpdf_app/android
          test -d apps/lexpdf_app/windows
          test -d apps/lexpdf_app/macos
          grep -q '^name: lexpdf_app$' apps/lexpdf_app/pubspec.yaml
          legacy='lex''xpdf_app'
          if grep -R "$legacy" -n apps/lexpdf_app .github/workflows; then
            echo 'Legacy package identity found.' >&2
            exit 1
          fi

  android-release:
    needs: prerelease-invariants
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lexpdf_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze
      - run: flutter test
      - name: Verify Android release hardening
        shell: bash
        run: |
          test -f android/app/proguard-rules.pro
          grep -q 'TextRecognitionScript.latin' lib/src/core/ocr/mobile_pdf_ocr_service.dart
          grep -q 'com.google.mlkit.vision.text.chinese' android/app/proguard-rules.pro
      - name: Build Android release APK
        run: >-
          flutter build apk --release
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: lexpdf-android-release
          path: apps/lexpdf_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-release:
    needs: prerelease-invariants
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/lexpdf_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: lexpdf-windows-release
          path: apps/lexpdf_app/build/windows/x64/runner/Release/**
          if-no-files-found: error

  macos-release:
    needs: prerelease-invariants
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/lexpdf_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock
      - name: Build macOS release
        run: >-
          flutter build macos --release
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: lexpdf-macos-release
          path: apps/lexpdf_app/build/macos/Build/Products/Release/*.app/**
          if-no-files-found: error

  backend-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cloudflare typecheck
        working-directory: backend/cloudflare
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Verify Supabase security invariants
        shell: bash
        run: |
          set -euo pipefail
          file='backend/supabase/migrations/20260907020000_complete_phase12_backend_security.sql'
          test -s "$file"
          grep -q 'enable row level security' "$file"
          grep -q 'revoke all on public.backend_events from anon, authenticated' "$file"
          grep -q 'to authenticated' "$file"
          grep -q 'as restrictive' "$file"
          grep -q 'security definer' "$file"
          grep -q 'revoke execute on function private.handle_new_user()' "$file"
          if grep -Eqi '(sb_secret_|postgres://)[[:space:]]*=' "$file"; then
            echo 'Potential credential material found in migration.' >&2
            exit 1
          fi
