name: Release Hardening

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  prerelease-invariants:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify reproducible release inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/lexpdf_app/pubspec.lock
          test -d apps/lexpdf_app/android
          test -d apps/lexpdf_app/windows
          test -f apps/lexpdf_app/tool/verify_android_target_sdk.sh
          bash apps/lexpdf_app/tool/verify_release_platform_scope.sh
          grep -q '^name: lexpdf_app$' apps/lexpdf_app/pubspec.yaml
          grep -q "defaultValue: 'development'" apps/lexpdf_app/lib/src/core/backend/backend_config.dart
          grep -q "flutter-version: '3.47.2'" .github/workflows/flutter-foundation.yml
          grep -q "flutter-version: '3.47.2'" .github/workflows/release-hardening.yml
          grep -Eq '^[[:space:]]*compileSdk = 36$' apps/lexpdf_app/android/app/build.gradle.kts
          grep -Eq '^[[:space:]]*targetSdk = 36$' apps/lexpdf_app/android/app/build.gradle.kts

          beta='.github/workflows/beta-distribution.yml'
          grep -q 'LEXPDF_ANDROID_KEYSTORE_BASE64' "$beta"
          grep -q 'apksigner_path' "$beta"
          grep -q 'verify_android_target_sdk.sh' "$beta"
          grep -q 'ANDROID_TARGET_SDK.txt' "$beta"
          grep -q 'SHA256SUMS-Android.txt' "$beta"
          grep -q 'LEXPDF_WINDOWS_CERTIFICATE_BASE64' "$beta"
          grep -q 'LEXPDF_WINDOWS_CERTIFICATE_PASSWORD' "$beta"
          grep -q 'WINDOWS_SIGNING_ENABLED' "$beta"
          grep -q 'Get-AuthenticodeSignature' "$beta"
          grep -q 'WINDOWS_SIGNING_STATUS.txt' "$beta"
          grep -q 'SHA256SUMS-Windows.txt' "$beta"

          legacy='lex''xpdf_app'
          if grep -R "$legacy" -n apps/lexpdf_app .github/workflows; then
            echo 'Legacy package identity found.' >&2
            exit 1
          fi

  android-release:
    needs: prerelease-invariants
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/lexpdf_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock
      - run: flutter analyze
      - run: flutter test
      - name: Verify Android release hardening
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/proguard-rules.pro
          grep -q 'TextRecognitionScript.latin' lib/src/core/ocr/mobile_pdf_ocr_service.dart
          grep -q 'com.google.mlkit.vision.text.chinese' android/app/proguard-rules.pro
          grep -q '<uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
      - name: Build Android release APK
        run: >-
          flutter build apk --release
          --dart-define=LEXPDF_ENVIRONMENT=production
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - name: Verify compiled APK targets Android 16+
        shell: bash
        run: |
          set -euo pipefail
          MINIMUM_TARGET_SDK=36 \
          ANDROID_TARGET_SDK_REPORT=ANDROID_TARGET_SDK.txt \
          bash tool/verify_android_target_sdk.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Smoke-check Android release artifact
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          test -s "$apk"
          unzip -l "$apk" | grep -q 'AndroidManifest.xml'
          unzip -l "$apk" | grep -q 'classes.dex'
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libapp.so'
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lexpdf-android-release
          path: |
            apps/lexpdf_app/build/app/outputs/flutter-apk/app-release.apk
            apps/lexpdf_app/ANDROID_TARGET_SDK.txt
          if-no-files-found: error
      - name: Build lightweight ABI-specific Android APKs
        run: >-
          flutter build apk --release --split-per-abi
          --dart-define=LEXPDF_ENVIRONMENT=production
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - name: Verify lightweight ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          universal='build/app/outputs/flutter-apk/app-release.apk'
          arm64='build/app/outputs/flutter-apk/app-arm64-v8a-release.apk'
          test -s "$arm64"
          unzip -l "$arm64" | grep -q 'AndroidManifest.xml'
          unzip -l "$arm64" | grep -q 'classes.dex'
          unzip -l "$arm64" | grep -q 'lib/arm64-v8a/libapp.so'
          if unzip -l "$arm64" | grep -q 'lib/x86_64/libapp.so'; then
            echo 'ARM64 APK unexpectedly contains x86_64 app code.' >&2
            exit 1
          fi
          if [ "$(stat -c%s "$arm64")" -ge "$(stat -c%s "$universal")" ]; then
            echo 'ARM64 APK must be smaller than the universal APK.' >&2
            exit 1
          fi
          MINIMUM_TARGET_SDK=36 \
          ANDROID_TARGET_SDK_REPORT=ANDROID_TARGET_SDK_ARM64.txt \
          bash tool/verify_android_target_sdk.sh "$arm64"
          sha256sum "$arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: lexpdf-android-arm64
          path: |
            apps/lexpdf_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/lexpdf_app/ANDROID_TARGET_SDK_ARM64.txt
          if-no-files-found: error

  windows-release:
    needs: prerelease-invariants
    runs-on: windows-2022
    defaults:
      run:
        working-directory: apps/lexpdf_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Verify lockfile is stable
        run: git diff --exit-code -- pubspec.lock
      - name: Run platform feature parity contracts
        run: flutter test test/platform_feature_parity_contract_test.dart
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=LEXPDF_ENVIRONMENT=production
          --dart-define=LEXPDF_GOOGLE_CLIENT_ID=${{ vars.LEXPDF_GOOGLE_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_CLIENT_ID=${{ vars.LEXPDF_MICROSOFT_CLIENT_ID }}
          --dart-define=LEXPDF_MICROSOFT_TENANT=${{ vars.LEXPDF_MICROSOFT_TENANT }}
          --dart-define=LEXPDF_AI_GATEWAY_URL=${{ vars.LEXPDF_AI_GATEWAY_URL }}
      - name: Smoke-check Windows release artifact
        shell: pwsh
        run: |
          $release = 'build/windows/x64/runner/Release'
          $exe = Join-Path $release 'lexpdf_app.exe'
          $flutterDll = Join-Path $release 'flutter_windows.dll'
          $assets = Join-Path $release 'data/flutter_assets'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Missing LexPDF executable.' }
          if ((Get-Item $exe).Length -le 0) { throw 'LexPDF executable is empty.' }
          if (-not (Test-Path $flutterDll -PathType Leaf)) { throw 'Missing flutter_windows.dll.' }
          if (-not (Test-Path $assets -PathType Container)) { throw 'Missing Flutter assets directory.' }
          Get-FileHash $exe -Algorithm SHA256
      - name: Install Inno Setup for delivery build
        run: choco install innosetup --no-progress -y
      - name: Build Windows 10 installer for delivery
        shell: pwsh
        run: |
          $version = '1.0.0-rc.1'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DMyAppVersion=$version" 'windows\installer\LexPDF.iss'
          $installer = Get-ChildItem 'windows\installer\output\*.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows installer was not produced.' }
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: lexpdf-windows-installer
          path: apps/lexpdf_app/windows/installer/output/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lexpdf-windows-release
          path: apps/lexpdf_app/build/windows/x64/runner/Release/**
          if-no-files-found: error

  backend-hardening:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cloudflare typecheck
        working-directory: backend/cloudflare
        run: |
          npm install --no-audit --no-fund
          npm run check
      - name: Verify Supabase security invariants
        shell: bash
        run: |
          set -euo pipefail
          file='backend/supabase/migrations/20260907020000_complete_phase12_backend_security.sql'
          test -s "$file"
          grep -q 'enable row level security' "$file"
          grep -q 'revoke all on public.backend_events from anon, authenticated' "$file"
          grep -q 'to authenticated' "$file"
          grep -q 'as restrictive' "$file"
          grep -q 'security definer' "$file"
          grep -q 'revoke execute on function private.handle_new_user()' "$file"
          if grep -Eqi '(sb_secret_|postgres://)[[:space:]]*=' "$file"; then
            echo 'Potential credential material found in migration.' >&2
            exit 1
          fi
