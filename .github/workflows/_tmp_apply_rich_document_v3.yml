name: Temporary Rich Document V3 Gate

on:
  push:
    branches: [feat/notebook-rich-document-v3]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notebook-rich-document-v3
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Decode and apply rich document integration
        run: |
          base64 -d .github/scripts/apply_rich_document_v3.py.gz.b64 | gzip -d > .github/scripts/apply_rich_document_v3.py
          python .github/scripts/apply_rich_document_v3.py
      - name: Resolve dependencies
        working-directory: apps/lexpdf_app
        run: flutter pub get
      - name: Format
        working-directory: apps/lexpdf_app
        run: dart format lib test
      - name: Analyze
        working-directory: apps/lexpdf_app
        run: flutter analyze
      - name: Test
        working-directory: apps/lexpdf_app
        run: flutter test
      - name: Build Android release smoke artifact
        working-directory: apps/lexpdf_app
        run: flutter build apk --release
      - name: Materialize validated production changes
        run: |
          rm -f .github/scripts/apply_rich_document_v3.py
          rm -f .github/scripts/apply_rich_document_v3.py.gz.b64
          rm -f .github/workflows/_tmp_apply_rich_document_v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(notebook): replace text boxes with rich document flow"
          git push origin HEAD:feat/notebook-rich-document-v3
