name: Temporary Rich Document V3 Gate

on:
  push:
    branches: [feat/notebook-rich-document-v3]

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/notebook-rich-document-v3
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Apply rich document integration
        run: |
          python .github/scripts/rich_document_v3_01_db_object.py
          python .github/scripts/rich_document_v3_02_chrome.py
          python .github/scripts/rich_document_v3_03_screen_setup.py
          python .github/scripts/rich_document_v3_04_screen_document.py
          python .github/scripts/rich_document_v3_05_screen_view_modes.py
          python .github/scripts/rich_document_v3_06_screen_commands_files.py
          python .github/scripts/rich_document_v3_07_tests.py
          python .github/scripts/rich_document_v3_08_contract_fixes.py
      - name: Vendor Fluent Editor compatibility patches
        run: |
          rm -rf third_party/fluent_editor
          mkdir -p third_party/fluent_editor
          git -C third_party/fluent_editor init
          git -C third_party/fluent_editor remote add origin https://github.com/exusr/fluent-editor.git
          git -C third_party/fluent_editor fetch --depth 1 origin 5676354889f7d5554458c9e97a85cfe640c4a133
          git -C third_party/fluent_editor checkout --detach FETCH_HEAD
          rm -rf third_party/fluent_editor/.git
          python - <<'PY'
          from pathlib import Path

          root = Path('third_party/fluent_editor')
          exporter = root / 'lib/services/odt_exporter.dart'
          text = exporter.read_text(encoding='utf-8')
          old = """    final mimeFile = ArchiveFile('mimetype', mimeBytes.length, mimeBytes);\n    mimeFile.compress = false;"""
          new = """    final mimeFile = ArchiveFile.noCompress(\n      'mimetype',\n      mimeBytes.length,\n      mimeBytes,\n    );"""
          if text.count(old) != 1:
              raise SystemExit('Unexpected fluent_editor ODT compression source; refusing an unsafe patch.')
          exporter.write_text(text.replace(old, new, 1), encoding='utf-8')

          pubspec = root / 'pubspec.yaml'
          spec = pubspec.read_text(encoding='utf-8')
          replacements = {
              '  archive: ^3.6.1\n': '  archive: ^4.0.5\n',
              '  file_picker: ^8.0.0\n': '  file_picker: 10.3.11\n',
          }
          for old_constraint, new_constraint in replacements.items():
              if spec.count(old_constraint) != 1:
                  raise SystemExit(
                      f'Unexpected fluent_editor dependency constraint {old_constraint.strip()!r}; '
                      'refusing an unsafe patch.'
                  )
              spec = spec.replace(old_constraint, new_constraint, 1)
          pubspec.write_text(spec, encoding='utf-8')

          (root / 'LEXPDF_PATCH.md').write_text(
              '''# LexPDF compatibility patch\n\n'
              'Vendored from `exusr/fluent-editor` at commit '
              '`5676354889f7d5554458c9e97a85cfe640c4a133` (version 1.1.0).\n\n'
              'LexPDF uses `archive` 4.x because its PDF document stack requires it. '
              'The upstream editor still declares `archive ^3.6.1` and uses the removed '
              '`ArchiveFile.compress` setter for the ODT mimetype entry. This vendor patch '
              'updates the constraint to `archive ^4.0.5` and uses '
              '`ArchiveFile.noCompress`, preserving the ODT requirement that `mimetype` '
              'is stored uncompressed.\n\n'
              'The upstream editor also declares `file_picker ^8.0.0`. That resolves to '
              '`file_picker 8.3.7`, whose Android library is compiled against API 34 and '
              'fails AAR metadata validation when `flutter_plugin_android_lifecycle` requires '
              'API 36. LexPDF pins `file_picker 10.3.11`, which retains the 10.x instance API '
              'used by Fluent Editor while using the Flutter compileSdk and supporting Gradle 9.\n\n'
              'The upstream MIT LICENSE is retained in this directory.\n''',
              encoding='utf-8',
          )
          PY
      - name: Resolve dependencies
        working-directory: apps/lexpdf_app
        run: |
          flutter pub get
          flutter pub deps --style=compact | grep -F 'file_picker 10.3.11'
          flutter pub deps --style=compact | grep -F 'archive 4.0.9'
      - name: Format rich document integration
        working-directory: apps/lexpdf_app
        run: |
          dart format \
            lib/src/core/backup/lex_backup_service.dart \
            lib/src/core/backup/lex_backup_streaming_restore_service.dart \
            lib/src/core/notebook/legacy_notebook_text_migrator.dart \
            lib/src/core/notebook/notebook_document_file_service.dart \
            lib/src/core/platform/legacy_word_converter.dart \
            lib/src/core/storage/local_database.dart \
            lib/src/core/storage/local_notebook_document_store.dart \
            lib/src/screens/layered_notebook_screen.dart \
            lib/src/widgets/notebook_object_layer.dart \
            lib/src/widgets/notebook_rich_document_surface.dart \
            lib/src/widgets/notebook_wordpad_chrome.dart \
            test/desktop_pdf_notebook_navigation_contract_test.dart \
            test/legacy_notebook_text_migrator_test.dart \
            test/library_notebook_interaction_contract_test.dart \
            test/local_notebook_document_store_test.dart \
            test/local_notebook_layer_store_test.dart \
            test/notebook_editor_ux_contract_test.dart \
            test/notebook_rich_text_contract_test.dart \
            test/notebook_text_input_contract_test.dart \
            test/notebook_wordpad_chrome_widget_test.dart \
            test/notebook_wordpad_editor_contract_test.dart \
            test/squid_import_service_test.dart
          dart format ../../third_party/fluent_editor/lib/services/odt_exporter.dart
      - name: Analyze
        working-directory: apps/lexpdf_app
        run: flutter analyze
      - name: Test
        working-directory: apps/lexpdf_app
        run: flutter test
      - name: Build Android release smoke artifact
        working-directory: apps/lexpdf_app
        run: flutter build apk --release
      - name: Materialize validated production changes
        run: |
          rm -f .github/scripts/rich_document_v3_*.py
          rm -f .github/workflows/_tmp_apply_rich_document_v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(notebook): replace text boxes with rich document flow"
          git push origin HEAD:feat/notebook-rich-document-v3
