name: lexpdf_app
description: LexPDF offline-first PDF reader, editor and digital notebook.
publish_to: "none"
version: 1.0.0-rc.1+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: 3.6.1
  crypto: ^3.0.7
  dart_pdf_reader: ^2.2.0
  file_selector: ^1.1.0
  fluent_editor: 1.1.0
  flutter_secure_storage: 10.3.1
  flutter_web_auth_2: ^5.1.0
  google_mlkit_text_recognition: ^0.17.1
  image: 4.5.4
  path_provider: ^2.1.5
  pdf: 3.12.0
  pdf_cos: 4.0.0
  pdf_document: 4.0.0
  pdfrx: ^2.6.1
  platform_ocr: ^1.0.0
  printing: 5.14.3
  sqlcipher_flutter_libs: 0.6.8
  sqlite3: ^2.9.3
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dependency_overrides:
  archive: 3.6.1
  pdfrx: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
