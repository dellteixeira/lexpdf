name: lexxpdf_app
description: LexPDF offline-first PDF reader, editor and digital notebook.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.1.0
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.9.2
  path_provider: ^2.1.5
  pdf: ^3.13.0
  pdfrx: ^2.6.1
  platform_ocr: ^1.0.0
  sqlite3: ^2.9.3
  sqlite3_flutter_libs: ^0.5.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
