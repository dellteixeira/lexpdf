name: lexpdf_app
description: LexPDF offline-first PDF reader, editor and digital notebook.
publish_to: "none"
version: 0.1.0-beta.1+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  crypto: ^3.0.7
  dart_pdf_reader: ^2.2.0
  file_selector: ^1.1.0
  flutter_secure_storage: 10.3.1
  flutter_web_auth_2: ^5.1.0
  google_mlkit_text_recognition: ^0.17.1
  image: ^4.9.2
  path_provider: ^2.1.5
  pdf: ^3.13.0
  pdfrx: ^2.6.1
  platform_ocr: ^1.0.0
  printing: ^5.15.0
  sqlite3: ^2.9.3
  sqlite3_flutter_libs: ^0.5.42
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2

dependency_overrides:
  pdfrx: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
