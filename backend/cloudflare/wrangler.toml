name = "lexpdf-api"
main = "src/index.ts"
compatibility_date = "2026-09-05"
workers_dev = true

[ai]
binding = "AI"

# Runtime bindings. Private credentials must be configured as encrypted secrets.

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "lexpdf-files"

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "lexpdf-sync"

[[queues.consumers]]
queue = "lexpdf-sync"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "lexpdf-sync-dlq"
retry_delay = 30

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://ibffselezupggrovfruz.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_LQGpMuuZbowHktUOW-TTrw_4F6e6k-d"
MAX_UPLOAD_BYTES = "262144000"
AI_DAILY_CREDIT_LIMIT = "240"
AI_GLOBAL_DAILY_CREDIT_LIMIT = "1200"
AI_RATE_LIMIT_PER_MINUTE = "12"
AI_MAX_INPUT_CHARS = "12000"
AI_QUICK_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_DEEP_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AI_EMBEDDING_MODEL = "@cf/baai/bge-m3"
AI_RAG_MAX_INPUT_CHARS = "30000"
AI_EMBED_RATE_LIMIT_PER_MINUTE = "60"
AI_VISION_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AI_VISION_MAX_IMAGE_BYTES = "6291456"

# Configure in Cloudflare as an encrypted secret:
# SUPABASE_SECRET_KEY
