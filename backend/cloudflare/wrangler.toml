name = "lexpdf-api"
main = "src/index.ts"
compatibility_date = "2026-09-05"
workers_dev = true

# Runtime bindings. Secrets must be configured in Cloudflare and are never committed.

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "lexpdf-files"

[[queues.producers]]
binding = "SYNC_QUEUE"
queue = "lexpdf-sync"

[[queues.consumers]]
queue = "lexpdf-sync"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "lexpdf-sync-dlq"
retry_delay = 30

[vars]
ENVIRONMENT = "production"
SUPABASE_URL = "https://ibffselezupggrovfruz.supabase.co"
MAX_UPLOAD_BYTES = "262144000"

# Configure in Cloudflare as encrypted secrets:
# SUPABASE_PUBLISHABLE_KEY
# SUPABASE_SECRET_KEY
